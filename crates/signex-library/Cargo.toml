[package]
name = "signex-library"
description = "Component library subsystem for Signex — data model, adapters, diff, search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
url = { version = "2", features = ["serde"] }
csv = "1.3"

# Atomic-write helper used by adapters (HI-6).
signex-types = { workspace = true }

# Optional 2D parametric sketch field on Footprint (v0.13+).
signex-sketch = { workspace = true }

# Heuristic AI-stub for symbol pinout extraction (WS-F).

# Tantivy search backend (WS-E).

# Local + git adapter (WS-A).

# Database adapter (WS-B) + community distributor adapters (WS-C) — both use
# the same `reqwest` blocking client. Adding `blocking` to the workspace
# default features (json + rustls-tls).

# Distributor adapters (WS-C).
# DigiKey scaffolding uses oauth2's blocking sync HTTP integration.

# Logging — used to surface non-fatal errors (cache writes, token rotation,
# mutex poison, etc.) without aborting the call. Light-weight and pure-Rust;
# kept un-feature-gated so every adapter can `tracing::warn!` consistently.
tracing = { workspace = true }

# OS-keychain backends (#976). keyring 3.x ships NO default backend: without one
# every OS silently falls back to its in-memory mock and nothing is persisted.
# Features are enabled per target and unify with the optional `keyring` dep above.
# Linux uses the pure-Rust zbus Secret Service client (`async-secret-service` +
# `crypto-rust`), so no libdbus / libsecret / OpenSSL is needed at build time.
# Deliberately NOT `linux-native-*-persistent`: its keyutils layer would keep
# working with no Secret Service and silently lose secrets on reboot.
[lints]
workspace = true

[features]
default = []
ai-stub = []
search-tantivy = []
local-git = []
test-identity = []
database = []
distributors-community = []
